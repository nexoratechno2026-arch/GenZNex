version: 2
updates:
  # Maintain dependencies for Next.js root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      next-dependencies:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      firebase-dependencies:
        patterns:
          - "firebase*"
          - "@firebase/*"

  # Maintain dependencies for Cloud Functions
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
