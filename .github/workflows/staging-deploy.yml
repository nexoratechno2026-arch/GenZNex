name: Staging Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging (genznex-staging)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_CI_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Deployment Credentials
        id: check_creds
        run: |
          if [ -z "$FIREBASE_CI_TOKEN" ]; then
            echo "::warning::FIREBASE_CI_TOKEN secret is not set in GitHub secrets. Deployment steps will be skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Verify Key Safety (Reject Live Keys on Staging)
        run: npx tsx scripts/verify-env-keys.ts staging
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.STAGING_RAZORPAY_KEY_ID }}

      - name: Deploy Firebase Security Rules & Indexes
        if: steps.check_creds.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          npx firebase-tools deploy --only firestore:rules,storage:rules,firestore:indexes --project genznex-staging --token "$FIREBASE_CI_TOKEN"

      - name: Deploy Cloud Functions (2nd Gen)
        if: steps.check_creds.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          npx firebase-tools deploy --only functions --project genznex-staging --token "$FIREBASE_CI_TOKEN"

      - name: Build Next.js Web App
        continue-on-error: true
        run: npm run build
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "false"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "genznex-staging"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.STAGING_RAZORPAY_KEY_ID }}

      - name: Deploy Firebase Hosting
        if: steps.check_creds.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          npx firebase-tools deploy --only hosting --project genznex-staging --token "$FIREBASE_CI_TOKEN"

      - name: Post-Deploy Smoke Health Probe
        run: |
          curl -f -s https://staging.genznex.in/api/health || echo "Staging health check initiated."
